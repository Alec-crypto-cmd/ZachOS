name: Build ZachOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ISO in privileged Arch container
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --privileged \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed archiso git
              bash -n profiledef.sh
              test -f pacman.conf
              test -s packages.x86_64
              mkarchiso -v -w /tmp/zachos-work -o /workspace/out .
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zachos-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
